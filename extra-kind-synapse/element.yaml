apiVersion: v1
kind: ConfigMap
metadata:
  name: element-config
data:
  config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "http://localhost:8009",
          "server_name": "matrix.k8s.test"
        }
      },
      "disable_custom_urls": true,
      "brand": "Element - Kubernetes"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-element
  template:
    metadata:
      labels:
        app: matrix-element
    spec:
      containers:
        - name: element
          image: ghcr.io/element-hq/element-web:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: element-config
---
apiVersion: v1
kind: Service
metadata:
  name: element
spec:
  selector:
    app: matrix-element
  ports:
    - port: 80
      targetPort: 80
